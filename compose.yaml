# Local development environment. Development only: all credentials are test values.
# Sprint 0 state: PostgreSQL is verified; ZITADEL is set up and verified with T-00.3 (DMS-19);
# object storage (SeaweedFS with Object Lock) with DMS-30; rendering worker (WeasyPrint) with DMS-44;
# search index (OpenSearch) with DMS-51.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms-lokal
    ports:
      - "5433:5432"  # 5433 to avoid clashing with a local PostgreSQL on 5432
    volumes:
      - dms-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      retries: 10

  zitadel-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-lokal
    volumes:
      - zitadel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.5
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: "LocalTestMasterkeyWith32Chars!!!"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8085
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel-lokal
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres-lokal
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # To verify in T-00.3: v4 requires the new login UI (separate container) by default.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # Machine user with a personal access token for scripts/zitadel-setup.sh (written to .local/zitadel/).
      ZITADEL_FIRSTINSTANCE_PATPATH: /setup/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: dms-setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: DMS setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
    user: "1000"
    volumes:
      - ./.local/zitadel:/setup
    ports:
      - "8085:8080"
    depends_on:
      zitadel-db:
        condition: service_healthy

  # S3-compatible object storage with Object Lock (ADR 0016). `weed mini` runs master, volume, filer and S3 in
  # one process; the access key below becomes the admin identity.
  objectstore:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: dms-local
      AWS_SECRET_ACCESS_KEY: dms-local-secret
    ports:
      - "9100:8333"  # S3 API; 9100 to avoid clashing with other local S3 servers on 9000
    volumes:
      - dms-objectstore:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      retries: 20

  # Creates the bucket `dms` with Object Lock (and therefore versioning) once. Object Lock can only be enabled
  # at bucket creation, so the bucket must not be created by any other means.
  objectstore-init:
    image: amazon/aws-cli:2.39.0@sha256:6014c77975a4ae237395924cc821333f20bf87c91964a45dd4ed5f3b13b424f5
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: dms-local
      AWS_SECRET_ACCESS_KEY: dms-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://objectstore:8333 s3api head-bucket --bucket dms 2>/dev/null ||
        aws --endpoint-url http://objectstore:8333 s3api create-bucket --bucket dms --object-lock-enabled-for-bucket
    restart: "no"

  # Rendering worker (ADR 0008, 0025): HTML -> PDF/A with WeasyPrint over HTTP (POST /render, GET /health).
  # Built from workers/rendering; stateless, no credentials, read-only file system. The application calls it at
  # dms.rendering.url (default http://localhost:9180).
  rendering:
    build: ./workers/rendering
    image: dms-rendering-worker:local
    ports:
      - "9180:8080"  # 9180 to avoid clashing with other local services on 8080
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 10s
      retries: 5

  # Search index (ADR 0009, 0029): derived from the database, rebuildable at any time. Single node, security plugin
  # disabled: local development only, never expose this port. The application uses dms.search.url (default
  # http://localhost:9200).
  opensearch:
    image: opensearchproject/opensearch:3.8.0@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - dms-search:/usr/share/opensearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      retries: 30

volumes:
  dms-db:
  zitadel-db:
  dms-objectstore:
  dms-search:
