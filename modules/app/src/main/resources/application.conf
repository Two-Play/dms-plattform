dms {
  http {
    port = 8080
    port = ${?DMS_HTTP_PORT}
  }
  # ZITADEL (ADR 0005). Values for local development come from .local/zitadel/dms.env.
  auth {
    issuer = "http://localhost:8085"
    issuer = ${?ZITADEL_ISSUER}
    # ZITADEL project id; access tokens must contain it as audience.
    audience = ${?DMS_ZITADEL_PROJECT_ID}
    # OIDC client id of the web UI. ID tokens sent for step-up (header X-DMS-Id-Token, DMS-86) must have it as
    # audience; without it, approval votes only accept an auth_time in the access token, which ZITADEL omits.
    clientId = ${?DMS_ZITADEL_CLIENT_ID}
  }
  # User directory (DMS-110): display names for user ids from ZITADEL's user service v2. Needs the personal access
  # token of a service user that may read users (scripts/zitadel-setup.sh creates `dms-directory` for development and
  # writes DMS_USER_DIRECTORY_TOKEN_FILE to .local/zitadel/dms.env). Without a token, user ids are not resolved.
  users {
    # ZITADEL API base URL; defaults to dms.auth.issuer.
    url = ${?DMS_USER_DIRECTORY_URL}
    tokenFile = ${?DMS_USER_DIRECTORY_TOKEN_FILE}
    token = ${?DMS_USER_DIRECTORY_TOKEN}
    timeoutMillis = 3000
    timeoutMillis = ${?DMS_USER_DIRECTORY_TIMEOUT_MILLIS}
    # Resolved and unknown users are kept this long, at most cacheSize of them.
    cacheSeconds = 600
    cacheSeconds = ${?DMS_USER_DIRECTORY_CACHE_SECONDS}
    cacheSize = 10000
    cacheSize = ${?DMS_USER_DIRECTORY_CACHE_SIZE}
  }
  # Application role: member of dms_app, subject to row-level security (ADR 0014).
  database {
    url = "jdbc:postgresql://localhost:5433/dms"
    url = ${?DMS_DB_URL}
    user = "dms_app_user"
    user = ${?DMS_DB_USER}
    password = "dms-app-local"
    password = ${?DMS_DB_PASSWORD}
    poolSize = 10
    poolSize = ${?DMS_DB_POOL_SIZE}
  }
  # Schema owner, used only by dms.app.Migrate.
  migration {
    user = "dms"
    user = ${?DMS_MIGRATION_USER}
    password = "dms-lokal"
    password = ${?DMS_MIGRATION_PASSWORD}
  }
  # S3-compatible object storage with Object Lock (ADR 0009, 0016). Local default: SeaweedFS from compose.yaml.
  storage {
    endpoint = "http://localhost:9100"
    endpoint = ${?DMS_STORAGE_ENDPOINT}
    region = "us-east-1"
    region = ${?DMS_STORAGE_REGION}
    bucket = "dms"
    bucket = ${?DMS_STORAGE_BUCKET}
    accessKey = "dms-local"
    accessKey = ${?DMS_STORAGE_ACCESS_KEY}
    secretKey = "dms-local-secret"
    secretKey = ${?DMS_STORAGE_SECRET_KEY}
  }
  # Periodic audit work (DMS-75): checkpoints of the chain head and daily RFC 3161 anchors.
  audit {
    checkpointIntervalSeconds = 300
    checkpointIntervalSeconds = ${?DMS_AUDIT_CHECKPOINT_INTERVAL_SECONDS}
    anchorHourUtc = 2
    anchorHourUtc = ${?DMS_AUDIT_ANCHOR_HOUR_UTC}
    # freetsa.org is for development only; production needs a qualified or contractually bound TSA.
    tsaUrl = "https://freetsa.org/tsr"
    tsaUrl = ${?DMS_AUDIT_TSA_URL}
    # PEM files of the TSA's CA. Empty: anchoring is disabled, checkpoints still run.
    tsaTrustedCertificates = []
  }
  worker {
    name = ${?DMS_WORKER_NAME}
  }
  # Review and approval workflows (ADR 0024). Approval votes need a sign-in (auth_time of the ID token in header
  # X-DMS-Id-Token, or of the access token) at most this old; the frontend re-authenticates with OIDC
  # max_age=0 / prompt=login when the API answers reauthentication_required.
  workflow {
    reauthenticationSeconds = 300
    reauthenticationSeconds = ${?DMS_WORKFLOW_REAUTHENTICATION_SECONDS}
    # Deputyships (DMS-99): notices to principal and deputy when a scheduled period begins or a period runs out.
    deputyshipCheckSeconds = 300
    deputyshipCheckSeconds = ${?DMS_WORKFLOW_DEPUTYSHIP_CHECK_SECONDS}
  }
  # Documents (ADR 0021, 0026). An editorial (minor) version that changes more than this share of the text gets a
  # warning (DMS-46); minor versions do not ask readers for a new acknowledgement unless configured. Approved
  # versions are published at 00:00 of their valid-from date in the tenant's time zone (DMS-45); new approvals are
  # picked up every publicationCheckSeconds.
  documents {
    editorialChangeThresholdPercent = 10
    editorialChangeThresholdPercent = ${?DMS_DOCUMENTS_EDITORIAL_CHANGE_THRESHOLD_PERCENT}
    minorVersionsRequireAcknowledgement = false
    minorVersionsRequireAcknowledgement = ${?DMS_DOCUMENTS_MINOR_VERSIONS_REQUIRE_ACKNOWLEDGEMENT}
    publicationCheckSeconds = 60
    publicationCheckSeconds = ${?DMS_DOCUMENTS_PUBLICATION_CHECK_SECONDS}
    # Periodic review (DMS-55, ADR 0030): review tasks at the class's lead time, ReviewDue on the review date.
    reviewCheckSeconds = 3600
    reviewCheckSeconds = ${?DMS_DOCUMENTS_REVIEW_CHECK_SECONDS}
  }
  # Partner master (US-03.1, ADR 0023). demo: fictitious partners in memory; http: the partner master's HTTP API.
  partners {
    directory = "demo"
    directory = ${?DMS_PARTNERS_DIRECTORY}
    baseUrl = ${?DMS_PARTNERS_BASE_URL}
    apiToken = ${?DMS_PARTNERS_API_TOKEN}
    timeoutMillis = 3000
    timeoutMillis = ${?DMS_PARTNERS_TIMEOUT_MILLIS}
    # After this many failures in a row, calls are rejected at once for openSeconds.
    failureThreshold = 3
    openSeconds = 30
  }
  # Rendering worker (ADR 0008, 0025): WeasyPrint over HTTP, `rendering` service of compose.yaml.
  rendering {
    url = "http://localhost:9180"
    url = ${?DMS_RENDERING_URL}
    timeoutSeconds = 60
    timeoutSeconds = ${?DMS_RENDERING_TIMEOUT_SECONDS}
  }
  # Search index (DMS-51, ADR 0029): OpenSearch, `opensearch` service of compose.yaml. Derived from the database and
  # rebuildable (POST /api/v1/admin/search/rebuild or `sbt "app/runMain dms.app.SearchRebuild"`). Documents changed
  # without an outbox event are picked up every syncIntervalSeconds.
  search {
    url = "http://localhost:9200"
    url = ${?DMS_SEARCH_URL}
    indexPrefix = "dms-documents"
    indexPrefix = ${?DMS_SEARCH_INDEX_PREFIX}
    replicas = 0
    replicas = ${?DMS_SEARCH_REPLICAS}
    timeoutSeconds = 10
    timeoutSeconds = ${?DMS_SEARCH_TIMEOUT_SECONDS}
    syncIntervalSeconds = 30
    syncIntervalSeconds = ${?DMS_SEARCH_SYNC_INTERVAL_SECONDS}
    username = ${?DMS_SEARCH_USERNAME}
    password = ${?DMS_SEARCH_PASSWORD}
  }
  # Attachments of document versions (DMS-114, ADR 0041). Uploads larger than maxSizeMegabytes are refused while they
  # stream; blockedExtensions (comma-separated, empty: built-in list of executable types) are refused, as are files that
  # start like an executable. scanner: virus scan before an attachment becomes available; "none" stores files as
  # NotScanned (see ADR 0041 for ClamAV).
  attachments {
    maxSizeMegabytes = 50
    maxSizeMegabytes = ${?DMS_ATTACHMENTS_MAX_SIZE_MEGABYTES}
    blockedExtensions = ""
    blockedExtensions = ${?DMS_ATTACHMENTS_BLOCKED_EXTENSIONS}
    scanner = "none"
    scanner = ${?DMS_ATTACHMENTS_SCANNER}
  }
  # Webhooks (DMS-58, ADR 0035): signed POST requests to subscribed systems, retried with exponential backoff.
  # Targets must be https with public addresses; allowedHosts (comma-separated) exempts development hosts (e.g. "localhost"),
  # allowPrivateNetworks opens private networks (https only) for receivers inside the company network.
  webhooks {
    allowedHosts = ""
    allowedHosts = ${?DMS_WEBHOOKS_ALLOWED_HOSTS}
    allowPrivateNetworks = false
    allowPrivateNetworks = ${?DMS_WEBHOOKS_ALLOW_PRIVATE_NETWORKS}
    timeoutSeconds = 10
    timeoutSeconds = ${?DMS_WEBHOOKS_TIMEOUT_SECONDS}
    maxAttempts = 12
    maxAttempts = ${?DMS_WEBHOOKS_MAX_ATTEMPTS}
  }
}
