dms {
  http {
    port = 8080
    port = ${?DMS_HTTP_PORT}
  }
  # Application role: member of dms_app, subject to row-level security (ADR 0014).
  database {
    url = "jdbc:postgresql://localhost:5433/dms"
    url = ${?DMS_DB_URL}
    user = "dms_app_user"
    user = ${?DMS_DB_USER}
    password = "dms-app-local"
    password = ${?DMS_DB_PASSWORD}
    poolSize = 10
    poolSize = ${?DMS_DB_POOL_SIZE}
  }
  # Schema owner, used only by dms.app.Migrate.
  migration {
    user = "dms"
    user = ${?DMS_MIGRATION_USER}
    password = "dms-lokal"
    password = ${?DMS_MIGRATION_PASSWORD}
  }
}
