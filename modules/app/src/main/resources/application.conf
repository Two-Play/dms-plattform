dms {
  http {
    port = 8080
    port = ${?DMS_HTTP_PORT}
  }
  # ZITADEL (ADR 0005). Values for local development come from .local/zitadel/dms.env.
  auth {
    issuer = "http://localhost:8085"
    issuer = ${?ZITADEL_ISSUER}
    # ZITADEL project id; access tokens must contain it as audience.
    audience = ${?DMS_ZITADEL_PROJECT_ID}
  }
  # Application role: member of dms_app, subject to row-level security (ADR 0014).
  database {
    url = "jdbc:postgresql://localhost:5433/dms"
    url = ${?DMS_DB_URL}
    user = "dms_app_user"
    user = ${?DMS_DB_USER}
    password = "dms-app-local"
    password = ${?DMS_DB_PASSWORD}
    poolSize = 10
    poolSize = ${?DMS_DB_POOL_SIZE}
  }
  # Schema owner, used only by dms.app.Migrate.
  migration {
    user = "dms"
    user = ${?DMS_MIGRATION_USER}
    password = "dms-lokal"
    password = ${?DMS_MIGRATION_PASSWORD}
  }
  # S3-compatible object storage with Object Lock (ADR 0009, 0016). Local default: SeaweedFS from compose.yaml.
  storage {
    endpoint = "http://localhost:9100"
    endpoint = ${?DMS_STORAGE_ENDPOINT}
    region = "us-east-1"
    region = ${?DMS_STORAGE_REGION}
    bucket = "dms"
    bucket = ${?DMS_STORAGE_BUCKET}
    accessKey = "dms-local"
    accessKey = ${?DMS_STORAGE_ACCESS_KEY}
    secretKey = "dms-local-secret"
    secretKey = ${?DMS_STORAGE_SECRET_KEY}
  }
  # Periodic audit work (DMS-75): checkpoints of the chain head and daily RFC 3161 anchors.
  audit {
    checkpointIntervalSeconds = 300
    checkpointIntervalSeconds = ${?DMS_AUDIT_CHECKPOINT_INTERVAL_SECONDS}
    anchorHourUtc = 2
    anchorHourUtc = ${?DMS_AUDIT_ANCHOR_HOUR_UTC}
    # freetsa.org is for development only; production needs a qualified or contractually bound TSA.
    tsaUrl = "https://freetsa.org/tsr"
    tsaUrl = ${?DMS_AUDIT_TSA_URL}
    # PEM files of the TSA's CA. Empty: anchoring is disabled, checkpoints still run.
    tsaTrustedCertificates = []
  }
  worker {
    name = ${?DMS_WORKER_NAME}
  }
  # Review and approval workflows (ADR 0024). Approval votes need a sign-in (token auth_time) at most this old;
  # the frontend re-authenticates with OIDC max_age / prompt=login when the API answers reauthentication_required.
  workflow {
    reauthenticationSeconds = 300
    reauthenticationSeconds = ${?DMS_WORKFLOW_REAUTHENTICATION_SECONDS}
  }
  # Documents (ADR 0021, 0026). An editorial (minor) version that changes more than this share of the text gets a
  # warning (DMS-46); minor versions do not ask readers for a new acknowledgement unless configured. Approved
  # versions are published at 00:00 of their valid-from date in the tenant's time zone (DMS-45); new approvals are
  # picked up every publicationCheckSeconds.
  documents {
    editorialChangeThresholdPercent = 10
    editorialChangeThresholdPercent = ${?DMS_DOCUMENTS_EDITORIAL_CHANGE_THRESHOLD_PERCENT}
    minorVersionsRequireAcknowledgement = false
    minorVersionsRequireAcknowledgement = ${?DMS_DOCUMENTS_MINOR_VERSIONS_REQUIRE_ACKNOWLEDGEMENT}
    publicationCheckSeconds = 60
    publicationCheckSeconds = ${?DMS_DOCUMENTS_PUBLICATION_CHECK_SECONDS}
  }
  # Partner master (US-03.1, ADR 0023). demo: fictitious partners in memory; http: the partner master's HTTP API.
  partners {
    directory = "demo"
    directory = ${?DMS_PARTNERS_DIRECTORY}
    baseUrl = ${?DMS_PARTNERS_BASE_URL}
    apiToken = ${?DMS_PARTNERS_API_TOKEN}
    timeoutMillis = 3000
    timeoutMillis = ${?DMS_PARTNERS_TIMEOUT_MILLIS}
    # After this many failures in a row, calls are rejected at once for openSeconds.
    failureThreshold = 3
    openSeconds = 30
  }
}
