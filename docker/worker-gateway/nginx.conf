# TCP relay to the workers (DMS-160, ADR 0076), see the service worker-gateway in compose.yaml. Plain TCP, so bodies and
# conversion times need no HTTP limits here. The names are resolved per connection: a recreated worker gets a new address.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

stream {
  resolver 127.0.0.11 valid=10s;
  proxy_connect_timeout 5s;
  proxy_timeout 300s;

  server {
    listen 9180;
    set $worker rendering:8080;
    proxy_pass $worker;
  }

  server {
    listen 9181;
    set $worker conversion:8080;
    proxy_pass $worker;
  }
}
